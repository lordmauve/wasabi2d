<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#e5484d"/>
    </marker>
  </defs>
  <rect width="980" height="520" rx="18" fill="#101521"/>

  <!-- Sphinx copies this SVG to _images, while the source stays in _static. -->
  <image href="../_static/primitives/ninepatch-panel.png"
         x="90" y="120" width="480" height="282"/>

  <g stroke="#e5484d" stroke-width="3" stroke-dasharray="9 7">
    <line x1="145" y1="92" x2="145" y2="430"/>
    <line x1="515" y1="92" x2="515" y2="430"/>
    <line x1="62" y1="168" x2="595" y2="168"/>
    <line x1="62" y1="358" x2="595" y2="358"/>
  </g>

  <g fill="#fff" font-family="sans-serif" font-size="18" font-weight="600">
    <text x="145" y="82" text-anchor="middle">x = 55</text>
    <text x="515" y="82" text-anchor="middle">x = 425</text>
    <text x="54" y="174" text-anchor="end">y = 48</text>
    <text x="54" y="364" text-anchor="end">y = 238</text>
  </g>

  <g stroke="#e5484d" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <line x1="160" y1="263" x2="500" y2="263"/>
    <line x1="330" y1="183" x2="330" y2="343"/>
  </g>
  <g fill="#fff" font-family="sans-serif" font-size="17">
    <rect x="260" y="241" width="140" height="31" rx="6" fill="#101521" opacity=".9"/>
    <text x="330" y="263" text-anchor="middle">stretch in x</text>
    <rect x="278" y="290" width="104" height="31" rx="6" fill="#101521" opacity=".9"/>
    <text x="330" y="312" text-anchor="middle">stretch in y</text>
  </g>

  <g font-family="monospace" font-size="19">
    <text x="630" y="90" fill="#ffd77a" font-family="sans-serif" font-size="24" font-weight="700">480 × 282 source</text>
    <text x="630" y="145" fill="#d6deeb">PANEL = w2d.NinePatch(</text>
    <text x="650" y="180" fill="#addb67">'ninepatch_panel',</text>
    <text x="650" y="215" fill="#82aaff">hcuts=(55, 425),</text>
    <text x="650" y="250" fill="#82aaff">vcuts=(48, 238),</text>
    <text x="630" y="285" fill="#d6deeb">)</text>
  </g>
  <g fill="#c8d1e0" font-family="sans-serif" font-size="17">
    <text x="630" y="345">Corners remain fixed.</text>
    <text x="630" y="375">Top and bottom stretch horizontally.</text>
    <text x="630" y="405">Left and right stretch vertically.</text>
    <text x="630" y="435">Only the center stretches both ways.</text>
  </g>
</svg>
