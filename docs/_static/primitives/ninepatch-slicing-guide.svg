<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#e5484d"/>
    </marker>
  </defs>
  <rect width="900" height="640" rx="18" fill="#101521"/>
  <image href="ninepatch-panel.png" x="40" y="60" width="500" height="500"/>

  <g stroke="#e5484d" stroke-width="3" stroke-dasharray="9 7">
    <line x1="140" y1="35" x2="140" y2="585"/>
    <line x1="440" y1="35" x2="440" y2="585"/>
    <line x1="15" y1="160" x2="565" y2="160"/>
    <line x1="15" y1="460" x2="565" y2="460"/>
  </g>

  <g fill="#fff" font-family="sans-serif" font-size="18" font-weight="600">
    <text x="140" y="27" text-anchor="middle">x = 77</text>
    <text x="440" y="27" text-anchor="middle">x = 307</text>
    <text x="572" y="166">y = 77</text>
    <text x="572" y="466">y = 307</text>
  </g>

  <g stroke="#e5484d" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <line x1="150" y1="300" x2="430" y2="300"/>
    <line x1="290" y1="170" x2="290" y2="450"/>
  </g>
  <g fill="#fff" font-family="sans-serif" font-size="17">
    <rect x="220" y="278" width="140" height="31" rx="6" fill="#101521" opacity=".9"/>
    <text x="290" y="300" text-anchor="middle">stretch in x</text>
    <rect x="238" y="365" width="104" height="31" rx="6" fill="#101521" opacity=".9"/>
    <text x="290" y="387" text-anchor="middle">stretch in y</text>
  </g>

  <g font-family="monospace" font-size="20">
    <text x="600" y="100" fill="#ffd77a" font-family="sans-serif" font-size="24" font-weight="700">384 × 384 source</text>
    <text x="600" y="155" fill="#d6deeb">PANEL = w2d.NinePatch(</text>
    <text x="625" y="190" fill="#addb67">'ninepatch_panel',</text>
    <text x="625" y="225" fill="#82aaff">hcuts=(77, 307),</text>
    <text x="625" y="260" fill="#82aaff">vcuts=(77, 307),</text>
    <text x="600" y="295" fill="#d6deeb">)</text>
  </g>
  <g fill="#c8d1e0" font-family="sans-serif" font-size="17">
    <text x="600" y="355">Corners remain fixed.</text>
    <text x="600" y="385">Top and bottom stretch horizontally.</text>
    <text x="600" y="415">Left and right stretch vertically.</text>
    <text x="600" y="445">Only the center stretches both ways.</text>
  </g>
</svg>
