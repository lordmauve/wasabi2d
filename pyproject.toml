[build-system]
requires = ["flit_scm>=1.7.0", "flit_core>=3.12,<4"]
build-backend = "flit_scm:buildapi"

[project]
name = "wasabi2d"
dynamic = ["version"]
description = "A convenient 2D OpenGL games framework"
readme = "README.md"
requires-python = ">=3.6"
license = { file = "LICENSE" }
authors = [{ name = "Daniel Pope", email = "mauve@mauveweb.co.uk" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Topic :: Education",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "pygame>=2.1",
    "moderngl>=5.7,<6",
    "numpy",
    "pyrr",
    "sortedcontainers",
    "dataclasses; python_version < '3.7'",
    "mapbox-earcut==1.0.*",
    "wasabi-geom>=2.0.1",
]

[project.urls]
Homepage = "https://github.com/lordmauve/wasabi2d"
Documentation = "https://wasabi2d.readthedocs.io/"
Changelog = "https://github.com/lordmauve/wasabi2d/releases"

[tool.setuptools_scm]
write_to = "wasabi2d/__version__.py"
write_to_template = "# Generated by setuptools_scm; do not edit.\n__version__ = {version!r}\n"

[tool.flit.sdist]
include = ["docs/", "examples/", "tests/", "requirements*.txt", "tox.ini"]
exclude = ["docs/_build/", "examples/v/", "**/__pycache__/", "**/*.pyc"]
